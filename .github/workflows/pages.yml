# Name shown for this workflow in the Actions tab.
name: Deploy portfolio to GitHub Pages

# Deploy automatically when main changes, or on a manual request.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant only the access needed to read the repo and publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an older deployment if a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: true

# Package and publish the static portfolio.
jobs:
  deploy:
    environment:
      # Use the standard Pages environment and expose its site URL in Actions.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Run the deployment steps on a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    steps:
      # Check out the repository files for packaging.
      - name: Checkout
        uses: actions/checkout@v4

      # Configure GitHub Pages and create its site if it is not enabled yet.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Package the static files from the repository root as the Pages artifact.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Publish the artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Name shown for this workflow in the Actions tab.
name: Deploy portfolio to GitHub Pages

# Deploy automatically when main changes, or on a manual request.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an older deployment if a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: true

# Package the site first, then deploy after the upload job completes.
jobs:
  build:
    # Grant access to read the repository and configure GitHub Pages.
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      # Check out the repository files for packaging.
      - name: Checkout
        uses: actions/checkout@v7

      # Configure GitHub Pages and create its site if it is not enabled yet.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Upload the site in this job so the artifact is ready before deployment starts.
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    # Start deployment only after the uploaded artifact is available.
    needs: build
    # Grant only the access needed to publish to Pages and request an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      # Use the standard Pages environment and expose its site URL in Actions.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Publish the artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
